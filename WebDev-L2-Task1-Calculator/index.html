<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app">
    <section class="calculator" aria-labelledby="calculatorTitle">
      <h1 id="calculatorTitle">Calculator</h1>
      <label class="visually-hidden" for="calcScreen">Calculator display</label>
      <input type="text" class="screen-output" id="calcScreen" value="0" readonly aria-live="polite">

      <section class="grid-keypad" aria-label="Calculator buttons">
        <button type="button" class="key action-clear k-c" data-type="clear" aria-label="Clear">C</button>
        <button type="button" class="key action-delete k-del" data-type="delete" aria-label="Delete last character">DEL</button>
        <button type="button" class="key action-op k-div" data-type="op" data-val="/" aria-label="Divide">&divide;</button>
        <button type="button" class="key action-op k-mul" data-type="op" data-val="*" aria-label="Multiply">&times;</button>
        <button type="button" class="key action-op k-sub" data-type="op" data-val="-" aria-label="Subtract">&minus;</button>

        <button type="button" class="key num-key k-7" data-type="num" data-val="7">7</button>
        <button type="button" class="key num-key k-8" data-type="num" data-val="8">8</button>
        <button type="button" class="key num-key k-9" data-type="num" data-val="9">9</button>
        <button type="button" class="key action-op k-add" data-type="op" data-val="+" aria-label="Add">+</button>

        <button type="button" class="key num-key k-4" data-type="num" data-val="4">4</button>
        <button type="button" class="key num-key k-5" data-type="num" data-val="5">5</button>
        <button type="button" class="key num-key k-6" data-type="num" data-val="6">6</button>
        <button type="button" class="key action-solve k-eq" data-type="equal" aria-label="Equals">=</button>

        <button type="button" class="key num-key k-1" data-type="num" data-val="1">1</button>
        <button type="button" class="key num-key k-2" data-type="num" data-val="2">2</button>
        <button type="button" class="key num-key k-3" data-type="num" data-val="3">3</button>

        <button type="button" class="key num-key k-0" data-type="num" data-val="0">0</button>
        <button type="button" class="key num-key k-dot" data-type="num" data-val=".">.</button>
        <button type="button" class="key action-percent k-percent" data-type="percent">%</button>
      </section>
    </section>

    <aside class="side-panel">
      <section class="history-card">
        <div class="panel-heading">
          <h2>History</h2>
          <button type="button" id="clearHistory">Clear</button>
        </div>
        <ol id="historyList" aria-live="polite">
          <li class="empty-history">No calculations yet</li>
        </ol>
      </section>

      <section class="hints-card">
        <h2>Keyboard hints</h2>
        <p><kbd>0–9</kbd> and <kbd>.</kbd> enter numbers</p>
        <p><kbd>+ − * /</kbd> choose an operator</p>
        <p><kbd>Enter</kbd> calculates the result</p>
        <p><kbd>Backspace</kbd> deletes one digit</p>
        <p><kbd>Esc</kbd> clears the calculator</p>
      </section>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
